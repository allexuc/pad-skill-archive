name: スキルアーカイブ更新

# 元データ（Mapaler/PADDashFormation の monsters-info）は日次で更新される。
# 毎週月曜の朝に取り直して、差分があれば docs/ を更新する。
#
# コミットするのは docs/pad_skill_archive.html だけにしている。
# SQLite(16MB) と archive.json.gz(1MB) も一緒に積むと 1回 18.7MB、
# 週次1年で約 0.95GB になりリポジトリが持たないため。
# SQLite が要る場合は末尾のリリース添付を使う。
on:
  schedule:
    - cron: "0 21 * * 0"   # UTC 21:00 日曜 = JST 月曜 06:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow を入れる
        run: pip install --quiet pillow

      - name: アーカイブを再ビルド
        run: |
          mkdir -p build docs
          python build_pad_archive.py --remote build
          python build_archive_html.py \
            build/archive.json.gz \
            docs/pad_skill_archive.html \
            mycategories.json \
            awoken.png

      - name: 生成物の検査
        # 生成されたHTMLに主要な機能が入っているか確かめる。
        # スクリプトの更新漏れや置換の空振りに気づかないまま
        # コミットしてしまうのを防ぐための歯止め。
        run: |
          python - <<'PYEOF'
          import sys
          from pathlib import Path

          html = Path("docs/pad_skill_archive.html").read_text(encoding="utf-8")
          required = {
              "タッチ端末の自動フォーカス抑止": "cameFromTouch",
              "任意ポインタでの端末判定":       "any-pointer: fine",
              "チップ押下時のスクロール保持":   "keepScrollInResults",
              "キャラ統合タブ":                 'data-tab="chars"',
              "覚醒の絞り込み":                 "awpick",
              "覚醒のグループ表示":             "awgrp-label",
              "マイカテゴリ":                   "mycatChips",
          }
          missing = [name for name, needle in required.items() if needle not in html]
          if missing:
              print("生成物に次の機能が入っていません:")
              for name in missing:
                  print("  -", name)
              print("build_archive_html.py が古い可能性があります。")
              sys.exit(1)
          print(f"検査OK: {len(required)} 項目 / {len(html)/1024/1024:.2f} MB")
          PYEOF

      - name: 中身が変わっているか確認
        id: diff
        run: |
          if git diff --quiet -- docs/pad_skill_archive.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更なし"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python - <<'PYEOF'
          import sqlite3
          c = sqlite3.connect("build/pad_archive.sqlite")
          q = c.cursor()
          print("モンスター:", q.execute("SELECT count(*) FROM monsters").fetchone()[0])
          for k in ("active", "leader"):
              n = q.execute("SELECT count(*) FROM skills WHERE kind=?", (k,)).fetchone()[0]
              print(f"{k}: {n}")
          print("覚醒:", q.execute("SELECT count(*) FROM awakenings").fetchone()[0])
          PYEOF
          fi

      - name: コミット
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pad_skill_archive.html
          git commit -m "スキルアーカイブ更新 $(date -u +%Y-%m-%d)"
          git push

      # SQLite も配りたい場合はこちらを有効にする。
      # リリース添付ならリポジトリの履歴には残らない。
      # - name: SQLite をリリースに添付
      #   if: steps.diff.outputs.changed == 'true'
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: data-${{ github.run_number }}
      #     files: build/pad_archive.sqlite
